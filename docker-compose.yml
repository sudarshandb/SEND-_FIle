services:
  mongo:
    image: mongo:latest
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 20
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/media_hosting
      UPLOAD_DIR: /app/uploads
      PUBLIC_BASE_URL: http://localhost:5000
      FRONTEND_BASE_URL: http://localhost:3000
      FRONTEND_ORIGIN: http://localhost:3000
    ports: ["5000:5000"]
    volumes:
      - ./backend/uploads:/app/uploads
    depends_on:
      mongo:
        condition: service_healthy
  frontend:
    build:
      context: ./frontend
      args:
        REACT_APP_API_URL: http://localhost:5000
    restart: unless-stopped
    ports: ["3000:80"]
    depends_on: [backend]
volumes:
  mongo_data:
